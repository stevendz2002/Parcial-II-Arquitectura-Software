<div class="table-responsive">
  <table class="table table-striped table-hover border align-middle">
    <thead class="table-dark">
      <tr>
        <th scope="col">ID</th>
        <th scope="col">Nombre</th>
        <th scope="col">Categoría</th>
        <th scope="col">Precio</th>
        <th scope="col">Disponibilidad</th>
        <th scope="col">Destacado</th>
      </tr>
    </thead>
    <tbody>
      @for (product of products; track product.id) {
        <tr>
          <th scope="row" class="text-truncate" style="max-width: 150px;">{{ product.id }}</th>
          <td class="fw-semibold text-start">{{ product.name }}</td>
          <td>{{ product.category }}</td>
          <td>{{ product.price | currency: 'USD': 'symbol': '1.2-2' }}</td>
          <td>
            <dsb-badge-atom
              [text]="getAvailabilityLabel(product.available)"
              [type]="getAvailabilityBadgeType(product.available)">
            </dsb-badge-atom>
          </td>
          <td>
            <dsb-badge-atom
              [text]="getFeaturedLabel(product.featured)"
              [type]="getFeaturedBadgeType(product.featured)">
            </dsb-badge-atom>
          </td>
        </tr>
      } @empty {
        <tr>
          <td colspan="6" class="text-center py-4 text-muted">
            No se encontraron productos registrados.
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>
