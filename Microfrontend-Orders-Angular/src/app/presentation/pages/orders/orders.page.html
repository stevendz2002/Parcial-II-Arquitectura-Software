<div class="container py-4">
  <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
    <div>
      <h2 class="h3 fw-bold mb-1">Módulo de Órdenes</h2>
      <p class="text-muted mb-0">Gestión de órdenes con Clean Architecture y Microfrontends</p>
    </div>

    <!-- Botones de alternancia entre los 3 Casos de Uso -->
    <div class="btn-group" role="group" aria-label="Filtro de Casos de Uso de Órdenes">
      <button
        type="button"
        class="btn"
        [class.btn-primary]="activeFilter === 'ALL'"
        [class.btn-outline-primary]="activeFilter !== 'ALL'"
        (click)="loadAllOrders()">
        Todas las Órdenes
      </button>

      <button
        type="button"
        class="btn"
        [class.btn-warning]="activeFilter === 'PENDING'"
        [class.btn-outline-warning]="activeFilter !== 'PENDING'"
        (click)="loadPendingOrders()">
        Órdenes Pendientes
      </button>

      <button
        type="button"
        class="btn"
        [class.btn-success]="activeFilter === 'COMPLETED'"
        [class.btn-outline-success]="activeFilter !== 'COMPLETED'"
        (click)="loadCompletedOrders()">
        Órdenes Completadas
      </button>
    </div>
  </div>

  <!-- Renderizado condicional según el Estado -->
  @switch (state) {
    @case ('loading') {
      <app-alert alertState="loading" text="Consultando órdenes desde el microservicio..."></app-alert>
    }

    @case ('error') {
      <app-alert alertState="error" [text]="errorMessage"></app-alert>
    }

    @case ('success') {
      <app-orders-table [orders]="orders"></app-orders-table>
    }
  }
</div>
